name: Build Khetrova Release APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (leave blank to auto-generate v1.0.RUN_NUMBER)"
        required: false
        type: string
      prerelease:
        description: "Mark this GitHub Release as a pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: khetrova-release-apk
  cancel-in-progress: false

jobs:
  build-release:
    name: Build release-variant APK and publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare release version
        id: release_meta
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          if [ -z "$tag" ]; then
            tag="v1.0.$RUN_NUMBER"
          fi
          if [[ ! "$tag" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid release tag. Use only letters, numbers, dots, underscores, and hyphens."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "APK_VERSION=$tag" >> "$GITHUB_OUTPUT"
          echo "Preparing Khetrova release: $tag"

      - name: Check signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$KEYSTORE_BASE64" ] || missing+=("KEYSTORE_BASE64")
          [ -n "$STORE_PASSWORD" ] || missing+=("STORE_PASSWORD")
          [ -n "$KEY_ALIAS" ] || missing+=("KEY_ALIAS")
          [ -n "$KEY_PASSWORD" ] || missing+=("KEY_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing GitHub Actions secret(s): %s\n' "${missing[*]}"
            echo "Create these secrets in Settings > Secrets and variables > Actions before running this workflow."
            exit 1
          fi

      - name: Build release APK (no cache or artifacts)
        id: apk_build
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ runner.temp }}/khetrova-upload-key.jks
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.release_meta.outputs.APK_VERSION }}
        run: |
          set -euo pipefail
          keystore_path="$KEYSTORE_PATH"
          trap 'if [ -n "${keystore_path:-}" ]; then rm -f "$keystore_path"; fi' EXIT

          if [ -n "$KEYSTORE_BASE64" ] &&
             [ -n "$STORE_PASSWORD" ] &&
             [ -n "$KEY_ALIAS" ] &&
             [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
            chmod 600 "$keystore_path"
            test -s "$keystore_path"
            signing_note="Signed with the configured permanent release keystore."
            apk_name="Khetrova-${VERSION_NAME}.apk"
          else
            rm -f "$keystore_path"
            unset KEYSTORE_PATH STORE_PASSWORD KEY_ALIAS KEY_PASSWORD
            signing_note="DEBUG-SIGNED TEST APK. Not for Play Store/public distribution; if a later build has a different signing key, uninstall the older app before installing it."
            apk_name="Khetrova-${VERSION_NAME}-debug-signed.apk"
            echo "::notice::No complete release keystore secrets were supplied. Building a debug-signed release variant for phone testing only."
          fi
          echo "signing_note=$signing_note" >> "$GITHUB_OUTPUT"
          echo "apk_file_name=$apk_name" >> "$GITHUB_OUTPUT"

          chmod +x ./gradlew
          ./gradlew --no-daemon --no-build-cache --rerun-tasks clean assembleRelease

          apk="app/build/outputs/apk/release/app-release.apk"
          if [ ! -s "$apk" ]; then
            echo "Release APK was not created or is empty."
            exit 1
          fi

          mkdir -p release-upload
          cp "$apk" "release-upload/$apk_name"
          sha256sum "release-upload/$apk_name" | tee release-upload/SHA256SUMS.txt
          echo "Signing: $signing_note" >> "$GITHUB_STEP_SUMMARY"
          echo "Built APK size:"
          du -h "release-upload/$apk_name"

      - name: Publish APK directly to GitHub Releases

        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: Khetrova ${{ steps.release_meta.outputs.tag }}
          target_commitish: main
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          body: |
            APK signing: ${{ steps.apk_build.outputs.signing_note }}

            Check the signing note before installing or distributing this APK.
          fail_on_unmatched_files: true
          files: |
            release-upload/${{ steps.apk_build.outputs.apk_file_name }}
            release-upload/SHA256SUMS.txt
